# The umbrella chart's values (spec/deployment.md). Every credential, and
# the database archive's server name, is a required value that no committed
# file sets (SECRET-1, PG-4): CI generates them for each cluster it creates,
# and the owner keeps theirs in a values file git ignores (SECRET-4, PG-10).
# Their places are in values.schema.json:
#
#   credentials:
#     garage: {rpcSecret, adminToken}
#     garageKeys: {database-backups, fetcher, discoverer}, each {id, secret}
#     database: {fetcher, discoverer, grafana}, each a role's password
#     grafana: {adminPassword}
#   database:
#     backups: {serverName}
#
# So is the commit the pipeline's own images are built from (IMG-1), which CI
# and the owner give as the commit checked out, after scripts/build_images.py
# has built and loaded its images (IMG-3, IMG-4):
#
#   images:
#     commit: 40 lower-case hexadecimal digits

# The fake EDGAR, which answers for the SEC's hosts from the stored versions
# under data/, for the tests on kind (spec/fake-edgar.md). Only CI sets
# enabled to true, so the owner's installations never include it (FAKE-1).
# Its image is the pipeline's own, built from images/fake-edgar/ and tagged
# with images.commit (FAKE-2, IMG-1).
fakeEdgar:
  enabled: false
  image: edgar/fake-edgar

# The pipeline's database: one CloudNativePG Cluster, whose Services and
# Secrets are named after it (spec/deployment.md, section 7).
database:
  # The only image the catalog names, of PostgreSQL 18 (PG-1). The database
  # Job runs its psql too.
  image: ghcr.io/cloudnative-pg/postgresql:18.6-standard-trixie@sha256:c7747d8d1049fff9cf30d9cd83d14d609c957afb5ffbcd114145f393ea1850e1
  instances: 3
  storage:
    size: 10Gi
  backups:
    # A base backup each day at midnight UTC, in CloudNativePG's schedule,
    # which begins with seconds (PG-4).
    schedule: "0 0 0 * * *"
  # The roles of the services that use the database, each its own, with its
  # password from credentials.database (PG-7). Of them, the fetcher's may
  # add records (PG-8), and the discoverer's notices (PG-12).
  services:
    - fetcher
    - discoverer

# The streams and their durable consumers, which a hook Job makes after each
# install and upgrade, in this order (NATS-3, NATS-5).
jetstream:
  setupImage: docker.io/natsio/nats-box:0.20.0@sha256:d2f04223f40e016f77922a8115d34b0cd5fad2ec10b19b39316ae92d07f3d295
  streams:
    - name: NOTICES
      subjects: [edgar.notices.filing, edgar.notices.gap, edgar.notices.backfill]
      retention: interest
      storage: file
      replicas: 3
      consumers:
        - name: scheduler-notices
          filterSubjects: [edgar.notices.gap, edgar.notices.backfill]
        - name: parse-workers-notices
          filterSubjects: [edgar.notices.filing]
    - name: RECORDS
      subjects: [edgar.records.poll, edgar.records.filing, edgar.records.backfill]
      retention: interest
      storage: file
      replicas: 3
      consumers:
        - name: discoverer-polls
          filterSubjects: [edgar.records.poll]
          maxAckPending: 1
        - name: discoverer-jobs
          filterSubjects: [edgar.records.filing, edgar.records.backfill]
          maxAckPending: 1
    - name: ORDERS
      subjects: [edgar.orders.backfill]
      retention: workqueue
      storage: file
      replicas: 3
      consumers:
        - name: discoverer-orders
          filterSubjects: [edgar.orders.backfill]
    - name: JOBS
      subjects: [edgar.jobs.poll, edgar.jobs.filing, edgar.jobs.backfill]
      retention: workqueue
      storage: file
      replicas: 3
      consumers: []

# What a hook Job sets up in Garage after each install and upgrade, through
# its admin API (GARAGE-2): each node's capacity in the layout, in bytes, its
# data claim's size; and each bucket, with the keys it grants, each a key of
# credentials.garageKeys. Only the fetcher's key may write the store's bucket,
# and no key may own a bucket (GARAGE-4).
garageSetup:
  image: docker.io/library/python:3.14-alpine@sha256:f6a589d43c42b9e7f7dc67a12d37132491f362859a5d750607710cc56da3bc72
  capacity: 10737418240
  buckets:
    database-backups:
      database-backups: {read: true, write: true}
    snapshots:
      fetcher: {read: true, write: true}
      discoverer: {read: true, write: false}

garage:
  fullnameOverride: garage
  garage:
    replicationFactor: "3"
    # It finds its peers through Kubernetes without making its definition,
    # which the operators' chart installs, and holds only a Role in its
    # namespace (GARAGE-1, CRD-6).
    kubernetesSkipCrd: true
    noClusterRole: true
    # From the Secret this chart renders, not one the chart generates
    # (SECRET-1, SECRET-2).
    existingRpcSecret: garage-credentials
    s3:
      api:
        region: garage
  # Three nodes, each keeping its metadata and its data on claims of its own
  # (GARAGE-1, VOL-2), on a worker node of its own (PLACE-1).
  deployment:
    kind: StatefulSet
    replicaCount: 3
  persistence:
    enabled: true
    meta:
      storageClass: edgar-retained
      size: 1Gi
    data:
      storageClass: edgar-retained
      size: 10Gi
  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: kubernetes.io/hostname
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: garage
              app.kubernetes.io/instance: edgar
  # The admin API's token, from the Secret this chart renders (SECRET-3).
  environment:
    - name: GARAGE_ADMIN_TOKEN
      valueFrom:
        secretKeyRef:
          name: garage-credentials
          key: adminToken
  # Each image by its tag and digest (PIN-4).
  image:
    repository: docker.io/dxflrs/garage
    tag: v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
  initImage:
    repository: docker.io/library/busybox
    tag: 1.38.0@sha256:fd7dc98638c8e305f4dc34e979f1c0fdfdcaeb0fbf8fcff77ae834b6da3d7e6e

nats:
  fullnameOverride: nats
  # One cluster of three servers with JetStream, each keeping its file store
  # on a claim of its own (NATS-1, VOL-2).
  config:
    cluster:
      enabled: true
      replicas: 3
    jetstream:
      enabled: true
      fileStore:
        pvc:
          size: 10Gi
          storageClassName: edgar-retained
  # Each server on a worker node of its own (PLACE-1).
  podTemplate:
    topologySpreadConstraints:
      kubernetes.io/hostname:
        maxSkew: 1
        whenUnsatisfiable: DoNotSchedule
  # Each image by its tag and digest (PIN-4).
  container:
    image:
      fullImageName: docker.io/library/nats:2.15.1-alpine@sha256:2ae57dfba3063d5e25fecb75256118c0882a1a2d2cf7d0fba17a7c701df956f6
  reloader:
    image:
      fullImageName: docker.io/natsio/nats-server-config-reloader:0.24.0@sha256:d758a82a9c20337e46c2f7356a413faa52cf4d6b02497c3ad81f72f1ba106464
  natsBox:
    container:
      image:
        fullImageName: docker.io/natsio/nats-box:0.20.0@sha256:d2f04223f40e016f77922a8115d34b0cd5fad2ec10b19b39316ae92d07f3d295

kube-prometheus-stack:
  fullnameOverride: monitoring
  # The first release installs the Prometheus operator's definitions (CRD-2).
  crds:
    enabled: false

  # Nothing kind doesn't expose is scraped (MON-1).
  kubeControllerManager:
    enabled: false
  kubeScheduler:
    enabled: false
  kubeEtcd:
    enabled: false
  kubeProxy:
    enabled: false
  defaultRules:
    rules:
      etcd: false
      kubeControllerManager: false
      kubeProxy: false
      kubeSchedulerAlerting: false
      kubeSchedulerRecording: false

  prometheusOperator:
    # The operator's webhook would refuse, on failure, the rules this chart
    # renders (CRD-3), so there is none, nor the Jobs that make its
    # certificates. promtool tests the pipeline's rules instead (0008).
    admissionWebhooks:
      enabled: false
    tls:
      enabled: false
    image:
      sha: 7c88d4e7bae63bd8d0f8da986054337c23b4472fa8d3c6817f5bc4b8407a2d6a
    prometheusConfigReloader:
      image:
        sha: 06b52bd4dbe3ed6dd5905aadaf8b9987d9da4c31d37bb86deaadae68cee2d26b

  # One replica, its data on a claim (MON-4, VOL-2).
  prometheus:
    prometheusSpec:
      replicas: 1
      image:
        sha: b2a413d5a03ea6a76782a508d1c7947440bba3b973931a25676e278431891b01
      storageSpec:
        volumeClaimTemplate:
          spec:
            storageClassName: edgar-retained
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 10Gi

  alertmanager:
    # Its only receiver is null, with no integration, so it sends nothing
    # outside the cluster (MON-3).
    config:
      route:
        receiver: "null"
        routes: []
      receivers:
        - name: "null"
    alertmanagerSpec:
      replicas: 1
      image:
        sha: e9733bafb1bdef9b00e25a21f8f99dc26a22224bf16641ad754d1649f4c3357a
      storage:
        volumeClaimTemplate:
          spec:
            storageClassName: edgar-retained
            accessModes: [ReadWriteOnce]
            resources:
              requests:
                storage: 1Gi

  grafana:
    fullnameOverride: grafana
    # One replica, which keeps no data: what it shows is provisioned (MON-4).
    replicas: 1
    persistence:
      enabled: false
    image:
      sha: ae3d3add290adbe6a88412229f5d76fd7bb82743050881698642d3d62f277e35
    testFramework:
      enabled: false
    # Its admin password from the Secret this chart renders (SECRET-1).
    admin:
      existingSecret: grafana-admin
      userKey: admin-user
      passwordKey: admin-password
    # Read-only: anonymous viewers, as Viewer only, and no way to sign in or
    # sign up (MON-2).
    grafana.ini:
      auth:
        disable_login_form: true
      auth.anonymous:
        enabled: true
        org_role: Viewer
      auth.basic:
        enabled: false
      users:
        allow_sign_up: false
    defaultDashboardsEditable: false
    # Its sidecar provisions dashboards only, which Grafana reads again from
    # their files on its own, so no reload signs in (MON-2).
    sidecar:
      image:
        sha: 092dbe0c335fba9af414a27630ca68f34df6185784fa847d9954187e69dbfdd7
      dashboards:
        enabled: true
        skipReload: true
        provider:
          allowUiUpdates: false
      datasources:
        enabled: false
    # Its data sources come only from this value, which its configuration
    # checksum covers (MON-2): Prometheus, and the record, read from the
    # database's replicas as Grafana's role, verifying the server against the
    # Cluster's certificate authority (MON-5).
    datasources:
      datasources.yaml:
        apiVersion: 1
        datasources:
          - name: Prometheus
            type: prometheus
            uid: prometheus
            url: http://monitoring-prometheus:9090/
            access: proxy
            isDefault: true
            editable: false
          - name: Record
            type: grafana-postgresql-datasource
            uid: record
            url: postgres-ro:5432
            user: grafana
            editable: false
            jsonData:
              database: edgar
              sslmode: verify-full
              tlsConfigurationMethod: file-path
              sslRootCertFile: /etc/grafana/postgres-ca/ca.crt
            secureJsonData:
              password: $GRAFANA_DATABASE_PASSWORD
    envValueFrom:
      GRAFANA_DATABASE_PASSWORD:
        secretKeyRef:
          name: postgres-grafana
          key: password
    # The authority's certificate alone, without its key (MON-5).
    extraSecretMounts:
      - name: postgres-ca
        secretName: postgres-ca
        mountPath: /etc/grafana/postgres-ca
        readOnly: true
        items:
          - key: ca.crt
            path: ca.crt

  kube-state-metrics:
    fullnameOverride: kube-state-metrics
    image:
      sha: sha256:42cfe3723a5f058171c627537fb57a3ea0f26e4380fa18555a95cb1a1b4cfc5b

  prometheus-node-exporter:
    fullnameOverride: node-exporter
    image:
      digest: sha256:8c9bac11973b94b59be88d6e11fee4429aa743c8846cdc75d65b18db33f6a106
