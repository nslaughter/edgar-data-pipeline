{{- /*
The fake EDGAR, which answers for the SEC's hosts from the stored versions its
image holds, for the tests on kind (spec/fake-edgar.md). Only CI sets
fakeEdgar.enabled (FAKE-1). A certificate authority of the release's own,
through cert-manager, issues its certificate for the SEC's hosts, and
cert-manager generates each key in the cluster (FAKE-3). It runs as one
replica of its image, built from the commit images.commit names, with its
certificate's Secret mounted, but no claim and no ServiceAccount token, behind
a Service with its server's port, 443, and its admin port, 8080 (FAKE-2,
IMG-1).
*/}}
{{- if .Values.fakeEdgar.enabled }}
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fake-edgar-self-signed
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fake-edgar-ca
spec:
  isCA: true
  commonName: The fake EDGAR's certificate authority
  secretName: fake-edgar-ca
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fake-edgar-self-signed
    kind: Issuer
    group: cert-manager.io
---
apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: fake-edgar-ca
spec:
  ca:
    secretName: fake-edgar-ca
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: fake-edgar
spec:
  secretName: fake-edgar-tls
  dnsNames:
    - www.sec.gov
    - data.sec.gov
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: fake-edgar-ca
    kind: Issuer
    group: cert-manager.io
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: fake-edgar
  labels:
    app.kubernetes.io/name: fake-edgar
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: fake-edgar
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: fake-edgar
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: fake-edgar
          image: {{ printf "%s:%s" .Values.fakeEdgar.image .Values.images.commit | quote }}
          imagePullPolicy: Never
          args:
            - --host
            - 0.0.0.0
            - --port
            - "8443"
            - --admin-port
            - "8080"
            - --certificate
            - /etc/fake-edgar/tls/tls.crt
            - --key
            - /etc/fake-edgar/tls/tls.key
          ports:
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: admin
              containerPort: 8080
              protocol: TCP
          # Its admin port listens once its server's does, after it has read
          # what it serves.
          readinessProbe:
            tcpSocket:
              port: admin
            periodSeconds: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: tls
              mountPath: /etc/fake-edgar/tls
              readOnly: true
      volumes:
        - name: tls
          secret:
            secretName: fake-edgar-tls
            items:
              - key: tls.crt
                path: tls.crt
              - key: tls.key
                path: tls.key
---
apiVersion: v1
kind: Service
metadata:
  name: fake-edgar
  labels:
    app.kubernetes.io/name: fake-edgar
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: fake-edgar
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: https
      port: 443
      targetPort: https
      protocol: TCP
    - name: admin
      port: 8080
      targetPort: admin
      protocol: TCP
{{- end }}
