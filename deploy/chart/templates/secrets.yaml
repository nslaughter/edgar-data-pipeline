{{- /*
Every credential the components use, but those an operator generates, from a
required value, each in a Secret its component reads (SECRET-1, SECRET-3).
*/}}
{{- $credentials := .Values.credentials }}
{{- range (append .Values.database.services "grafana") }}
---
# The password of a database role (PG-7, PG-11), which CloudNativePG sets.
apiVersion: v1
kind: Secret
metadata:
  name: postgres-{{ . }}
  labels:
    cnpg.io/reload: "true"
type: kubernetes.io/basic-auth
stringData:
  username: {{ . }}
  password: {{ index $credentials.database . | quote }}
{{- end }}
{{- range $name, $key := $credentials.garageKeys }}
---
# A Garage key, which the Garage Job imports (GARAGE-2), named and shaped as
# S3 clients read their credentials.
apiVersion: v1
kind: Secret
metadata:
  name: garage-key-{{ $name }}
type: Opaque
stringData:
  AWS_ACCESS_KEY_ID: {{ $key.id | quote }}
  AWS_SECRET_ACCESS_KEY: {{ $key.secret | quote }}
  AWS_REGION: {{ $.Values.garage.garage.s3.api.region | quote }}
{{- end }}
---
# Garage's RPC secret, which its nodes share, and its admin API's token.
apiVersion: v1
kind: Secret
metadata:
  name: garage-credentials
type: Opaque
stringData:
  rpcSecret: {{ $credentials.garage.rpcSecret | quote }}
  adminToken: {{ $credentials.garage.adminToken | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-admin
type: Opaque
stringData:
  admin-user: admin
  admin-password: {{ $credentials.grafana.adminPassword | quote }}
