[project]
name = "edgar-data-pipeline"
version = "0.0.0.dev0"
description = "A reproducible pipeline for SEC EDGAR filings: versioned feed snapshots, bulk import, and bitemporal queries over restated financial data."
readme = "README.md"
requires-python = ">=3.12"
# The scripts and the fake EDGAR use only the standard library, so a rerun
# needs no pinned packages. The services' own dependencies arrive with them.
dependencies = []

[project.urls]
Repository = "https://github.com/nslaughter/edgar-data-pipeline"

[dependency-groups]
dev = [
    "hypothesis>=6",
    "jsonschema>=4",
    "mypy>=1",
    "pytest>=8",
    "pyyaml>=6",
    "ruff>=0.16",
    "types-jsonschema>=4",
    "types-markdown>=3",
    "types-pyyaml>=6",
    "zensical>=0.0.70",
]

[tool.uv]
# Nothing to build: the scripts run as they are, and each service under src/
# runs from its source, in an image of its own (spec/deployment.md, IMG-5).
package = false

[tool.ruff]
line-length = 100
# Ruff would also format the Python in Markdown code blocks.
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "PT"]

[tool.mypy]
strict = true
files = ["scripts", "src", "tests"]
mypy_path = "scripts:src"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts", "src"]
addopts = ["-ra", "--strict-config", "--strict-markers", "--import-mode=importlib"]
xfail_strict = true
markers = ["spec(*ids): the spec/*.md statements a test checks"]
filterwarnings = ["error"]
