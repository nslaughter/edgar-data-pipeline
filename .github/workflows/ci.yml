name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
        with:
          # verify.py --since reads the history of data/ (LOG-1, LOG-2).
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: ${{ matrix.python }}
          enable-cache: true
      # The deployment's tests render the charts (spec/deployment.md, section
      # 3), with Helm at an exact version of major version 4 (PIN-7).
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - name: Install the development environment
        run: uv sync --locked
      - name: Check formatting
        run: uv run ruff format --check .
      - name: Lint
        run: uv run ruff check .
      - name: Type-check
        run: uv run mypy
      - name: Test
        run: uv run pytest
      - name: Verify the store, and its history since the base branch
        if: github.event_name == 'pull_request'
        run: uv run scripts/verify.py --since "origin/${{ github.base_ref }}"
      - name: Verify the store, and its history since the previous commit
        if: github.event_name == 'push'
        run: uv run scripts/verify.py --since "${{ github.event.before }}"

  # The Go module's checks (decision record 0006): that go.mod and the
  # generated code are current, go vet, golangci-lint, and go test, whose
  # envtest tests run against an API server of the minor version kind's
  # nodes run (internal/testenv).
  go:
    name: Go
    runs-on: ubuntu-latest
    env:
      ENVTEST_K8S_VERSION: "1.36.2"
    steps:
      - uses: actions/checkout@v7
      # The Go of go.mod's toolchain line.
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Check that go.mod and go.sum are tidy
        run: go mod tidy -diff
      - name: Check that the generated code is current
        run: |
          go tool controller-gen object paths=./api/...
          git diff --exit-code
      - name: Vet
        run: go vet ./...
      - uses: golangci/golangci-lint-action@v9.3.0
        with:
          version: v2.15.0
      - name: Install envtest's binaries
        run: echo "KUBEBUILDER_ASSETS=$(go tool setup-envtest use "$ENVTEST_K8S_VERSION" -p path)" >>"$GITHUB_ENV"
      - name: Test
        run: go test -race ./...

  # Installs the four charts on kind, then upgrades them, and runs the tests
  # of how the installed charts behave (spec/deployment.md, section 3).
  kind:
    name: kind
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # The tests of the installed charts run against this context, and are
      # skipped where it isn't set.
      EDGAR_KUBE_CONTEXT: kind-edgar
      # The job upgrades each release after installing it, so the tests
      # require each release's history to show both (CHART-4).
      EDGAR_CHARTS_UPGRADED: "true"
      # The job installs the fake EDGAR, which only CI installs, so the tests
      # require it (FAKE-4, FAKE-5).
      EDGAR_FAKE_EDGAR: "true"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.14"
          enable-cache: true
      # Helm and kind at exact versions, Helm at major version 4 (PIN-7), and
      # kubectl at the cluster's version. kind is the release whose node
      # image deploy/kind.yaml pins.
      - uses: azure/setup-helm@v5.0.1
        with:
          version: v4.3.1
      - uses: helm/kind-action@v1.15.1
        with:
          version: v0.32.0
          kubectl_version: v1.36.1
          install_only: true
      - name: Install the development environment
        run: uv sync --locked
      # The Go of go.mod's toolchain line, with which the tests build the
      # transfer and run it as the owner does, outside the cluster
      # (spec/deployment.md, section 5, the transfer).
      - uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
      - name: Create the kind cluster
        run: kind create cluster --config deploy/kind.yaml --wait 120s
      # The pipeline's own images, built from the commit checked out, tagged
      # with it, and loaded into each node, by the one command that does so
      # (IMG-2, IMG-3).
      - name: Build the pipeline's images and load them into kind
        run: uv run scripts/build_images.py
      # Before the umbrella chart is installed, CoreDNS answers a pod's query
      # for the SEC's hosts with the address of the fake EDGAR's Service in
      # the release namespace, so no pod of the installed charts reaches the
      # SEC (FAKE-4). Each name is rewritten to the Service's, and the
      # answer's name back to the name asked for, which resolvers check.
      - name: Point the cluster's DNS for the SEC's hosts at the fake EDGAR
        run: |
          rules=$(cat <<'EOF'
              rewrite stop {
                  name regex ^www\.sec\.gov\.$ fake-edgar.edgar.svc.cluster.local.
                  answer name ^fake-edgar\.edgar\.svc\.cluster\.local\.$ www.sec.gov.
              }
              rewrite stop {
                  name regex ^data\.sec\.gov\.$ fake-edgar.edgar.svc.cluster.local.
                  answer name ^fake-edgar\.edgar\.svc\.cluster\.local\.$ data.sec.gov.
              }
          EOF
          )
          kubectl get configmap coredns --namespace kube-system -o json \
            | jq --arg rules "$rules" '.data.Corefile |= sub("^\\.:53 \\{\n"; ".:53 {\n" + $rules + "\n")' \
            >"$RUNNER_TEMP/coredns.json"
          jq -e '.data.Corefile | contains("fake-edgar")' "$RUNNER_TEMP/coredns.json" >/dev/null
          kubectl replace -f "$RUNNER_TEMP/coredns.json"
          kubectl rollout restart deployment coredns --namespace kube-system
          kubectl rollout status deployment coredns --namespace kube-system --timeout 120s
      # New credentials for each cluster, and a new name for its database's
      # archive, each masked in the log and kept outside the repository
      # (SECRET-4, PG-10); and a user agent for the fetcher, whose requests
      # reach only the fake EDGAR (FETCH-17, CHECK-3).
      - name: Generate the cluster's credentials
        run: |
          umask 077
          masks="$RUNNER_TEMP/masks"
          hex() {
            value=$(openssl rand -hex "$1")
            echo "$value" >>"$masks"
            printf '%s' "$value"
          }
          values="$RUNNER_TEMP/edgar-values.yaml"
          cat >"$values" <<EOF
          credentials:
            garage:
              rpcSecret: "$(hex 32)"
              adminToken: "$(hex 32)"
            garageKeys:
              database-backups: {id: "GK$(hex 12)", secret: "$(hex 32)"}
              fetcher: {id: "GK$(hex 12)", secret: "$(hex 32)"}
              discoverer: {id: "GK$(hex 12)", secret: "$(hex 32)"}
              transfer: {id: "GK$(hex 12)", secret: "$(hex 32)"}
            database:
              fetcher: "$(hex 24)"
              discoverer: "$(hex 24)"
              grafana: "$(hex 24)"
              transfer: "$(hex 24)"
            grafana:
              adminPassword: "$(hex 24)"
          database:
            backups:
              serverName: "ci-${{ github.run_id }}-${{ github.run_attempt }}"
          fetcher:
            secUserAgent: "edgar-data-pipeline CI ci-$(hex 8)@example.invalid"
          EOF
          while read -r value; do echo "::add-mask::$value"; done <"$masks"
          rm "$masks"
          echo "EDGAR_VALUES=$values" >>"$GITHUB_ENV"
      # The four releases, each in its namespace, in order, each once the one
      # before it is ready (CHART-4); then each upgraded in the same order,
      # which runs the umbrella chart's hook Jobs again. The umbrella chart
      # runs the images built from the commit checked out (IMG-3), and the
      # fake EDGAR (FAKE-4). Its values allow requests, as the owner decided:
      # the fetcher's requests reach only the fake EDGAR, whose authority it
      # alone trusts there (FETCHER-12, FETCHER-13).
      - name: Install and upgrade the charts
        run: |
          commit=$(git rev-parse HEAD)
          for action in install upgrade; do
            create=$([ "$action" = install ] && echo --create-namespace || true)
            helm "$action" prometheus-crds deploy/prometheus-crds --namespace edgar $create --wait --timeout 10m
            helm "$action" cert-manager deploy/cert-manager --namespace cert-manager $create --wait --timeout 10m
            helm "$action" operators deploy/operators --namespace cnpg-system $create --wait --timeout 10m
            helm "$action" edgar deploy/chart --namespace edgar --values "$EDGAR_VALUES" \
              --set images.commit="$commit" --set fakeEdgar.enabled=true \
              --set controls.secAccess.paused=false --wait --timeout 20m
          done
      - name: Test the installed charts
        run: uv run pytest tests/test_kind.py -v
      # What went wrong, without the credentials: no Secret is shown.
      - name: Show the cluster's state
        if: failure()
        run: |
          kubectl get nodes -o wide
          kubectl get pods --all-namespaces -o wide
          kubectl get events --all-namespaces --sort-by=.lastTimestamp | tail -100
          kubectl get jobs,clusters.postgresql.cnpg.io,backups.postgresql.cnpg.io --namespace edgar
          kubectl get issuers.cert-manager.io,certificates.cert-manager.io --namespace edgar
          # The fake EDGAR writes no request header to its output (REQ-2).
          kubectl logs --namespace edgar deployment/fake-edgar --tail=100 || true
          kubectl logs --namespace edgar --selector app.kubernetes.io/name=scheduler --prefix --tail=100 || true
          # The fetcher writes no request header to its output (ID-1).
          kubectl logs --namespace edgar --selector app.kubernetes.io/name=fetcher --prefix --tail=200 || true
          kubectl get sources.edgar.nathanslaughter.com,secaccesses.edgar.nathanslaughter.com,leases --namespace edgar -o wide || true
          for job in garage-setup jetstream-setup database-setup; do
            echo "--- $job"
            kubectl logs --namespace edgar "job/$job" --tail=100 || true
          done
