# Backfill, v1alpha1: a company's past filings, over a range of filing dates,
# fetched once. spec/controls.md governs it (section 7); changing it changes
# that spec.
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: backfills.edgar.nathanslaughter.com
spec:
  group: edgar.nathanslaughter.com
  names:
    kind: Backfill
    listKind: BackfillList
    plural: backfills
    singular: backfill
  scope: Namespaced
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: CIK
          type: integer
          jsonPath: .spec.cik
        - name: From
          type: string
          jsonPath: .spec.filingDateFrom
        - name: To
          type: string
          jsonPath: .spec.filingDateTo
        - name: Filings
          type: integer
          jsonPath: .status.filings
        - name: Fetched
          type: integer
          jsonPath: .status.filingsFetched
        - name: Failed
          type: integer
          jsonPath: .status.filingsFailed
        - name: Complete
          type: string
          jsonPath: .status.conditions[?(@.type=="Complete")].status
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [cik, filingDateFrom, filingDateTo]
              x-kubernetes-validations:
                - rule: self == oldSelf
                  message: a Backfill's spec can't change; add another Backfill instead
                - rule: self.filingDateFrom <= self.filingDateTo
                  message: filingDateTo is before filingDateFrom
              properties:
                cik:
                  type: integer
                  format: int64
                  minimum: 1
                  maximum: 9999999999
                filingDateFrom:
                  type: string
                  format: date
                filingDateTo:
                  type: string
                  format: date
            status:
              type: object
              properties:
                filings:
                  type: integer
                  format: int32
                  minimum: 0
                filingsFetched:
                  type: integer
                  format: int32
                  minimum: 0
                filingsFailed:
                  type: integer
                  format: int32
                  minimum: 0
                startTime:
                  type: string
                  format: date-time
                  pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
                completionTime:
                  type: string
                  format: date-time
                  pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}\.[0-9]{3}Z$
                conditions:
                  type: array
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
                  items:
                    type: object
                    required: [lastTransitionTime, message, reason, status, type]
                    properties:
                      lastTransitionTime:
                        type: string
                        format: date-time
                      message:
                        type: string
                        maxLength: 32768
                      observedGeneration:
                        type: integer
                        format: int64
                        minimum: 0
                      reason:
                        type: string
                        minLength: 1
                        maxLength: 1024
                        pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      status:
                        type: string
                        enum: ["True", "False", "Unknown"]
                      type:
                        type: string
                        maxLength: 316
                        pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
